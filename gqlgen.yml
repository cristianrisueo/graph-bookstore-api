# ¿Dónde están los archivos del esquema? Se admiten globs, p. ej. src/**/*.graphqls
schema:
  - graph/*.graphqls

# ¿Dónde se genera el código del servidor?
exec:
  package: graph
  layout: single-file # La otra opción es "follow-schema", es decir, varios archivos.

  # Solo para el layout single-file:
  filename: graph/generated.go

  # Solo para el layout follow-schema:
  # dir: graph
  # filename_template: "{name}.generated.go"

  # Opcional: número máximo de goroutines concurrentes por resolver hijo (por defecto: ilimitado)
  # worker_limit: 1000

# Descomenta para activar la federación
# federation:
#   filename: graph/federation.go
#   package: graph
#   version: 2
#   options:
#     # Genera una función para rellenar los campos @requires (no se puede usar con computed_requires)
#     explicit_requires: false
#     # Genera resolvers para calcular los valores de los campos @requires (requiere version 2 y call_argument_directives_with_null: true)
#     computed_requires: false
#     # Motor por defecto para generar entityResolver; se puede sobrescribir por entidad con @entityResolver(multi: Boolean)
#     entity_resolver_multi: false

# ¿Dónde se generan los modelos?
model:
  filename: graph/model/models_gen.go
  package: model

  # Opcional: ruta a una plantilla gotpl propia para generar los modelos
  # model_template: [your/path/model.gotpl]

# ¿Dónde van las implementaciones de los resolvers?
resolver:
  package: graph
  layout: follow-schema # La otra opción es "single-file".

  # Solo para el layout single-file:
  # filename: graph/resolver.go

  # Solo para el layout follow-schema:
  dir: graph
  filename_template: "{name}.resolvers.go"

  # Opcional: actívalo para no generar los comentarios de plantilla encima de los resolvers
  # omit_template_comment: false
  # Opcional: ruta a una plantilla gotpl propia para generar los resolvers
  # resolver_template: [your/path/resolver.gotpl]
  # Opcional: actívalo para no reescribir los resolvers existentes al generar
  # preserve_resolver: false
  # Opcional: actívalo para guardar el resolver raíz en un campo "r" en lugar de embeberlo.
  # Acelera la compilación en esquemas grandes. Rompe el código de los resolvers existentes:
  # a las dependencias se accede como r.r.myService en lugar de r.myService.
  # omit_resolver_embedding: false
  # Opcional: nombre del struct del resolver (por defecto: Resolver)
  # type: Resolver

# Opcional: actívalo para usar etiquetas ` + "`" + `gqlgen:"fieldName"` + "`" + ` en tus modelos
# struct_tag: json

# Opcional: prefijo para los structs embebidos (por defecto: "Base")
# embedded_structs_prefix: Base

# Opcional: configuración de directivas propias
# directives:
#   hasRole:
#     skip_runtime: false

# Opcional: prefijo de paquetes locales para ordenar los imports
# local_prefix: ""

# Opcional: actívalo para usar []Thing en lugar de []*Thing
# omit_slice_element_pointers: false

# Opcional: actívalo para omitir los métodos getter en los modelos
# omit_getters: false

# Opcional: actívalo para omitir los métodos Is<Name>() en interfaces y uniones
# omit_interface_checks: true

# Opcional: actívalo para no generar el contenido del struct ComplexityRoot ni la función Complexity
# omit_complexity: false

# Opcional: actívalo para no generar el aviso de archivo generado en los archivos generados
# omit_gqlgen_file_notice: false

# Opcional: actívalo para quitar la versión de gqlgen del aviso de archivo generado. No tiene efecto si `omit_gqlgen_file_notice` es true.
# omit_gqlgen_version_in_file_notice: false

# Opcional: actívalo para excluir los modelos raíz, como Query y Mutation, del archivo de modelos generado.
# omit_root_models: false

# Opcional: actívalo para excluir los campos con resolver del archivo de modelos generado.
# omit_resolver_fields: false

# Opcional: actívalo para omitir el manejador de panics en el servidor generado
# omit_panic_handler: false

# Opcional: actívalo para no generar el marshaler/unmarshaler JSON de los enums
# omit_enum_json_marshalers: false

# Opcional: desactívalo para que los campos de tipo struct no usen punteros,
# p. ej. type Thing struct { FieldA OtherThing } en lugar de { FieldA *OtherThing }
# struct_fields_always_pointers: true

# Opcional: desactívalo para que los resolvers devuelvan valores en lugar de punteros a structs
# resolvers_always_return_pointers: true

# Opcional: actívalo para devolver punteros en lugar de valores en unmarshalInput
# return_pointers_in_unmarshalinput: false

# Opcional: envuelve los campos de entrada anulables con Omittable
# nullable_input_omittable: true

# Opcional: añade omitempty a la etiqueta json de los campos de los modelos generados
# enable_model_json_omitempty_tag: false

# Opcional: añade omitzero a la etiqueta json de los campos de los modelos generados
# enable_model_json_omitzero_tag: false

# Opcional: acelera la generación omitiendo la pasada final de validación.
# skip_validation: true

# Opcional: evita ejecutar `go mod tidy` al generar el código del servidor
# skip_mod_tidy: true

# Opcional: si es true, las directivas de argumento que decoran
# un campo con valor null se siguen llamando.
#
# Así las directivas de argumento no solo pueden modificar
# los valores de los argumentos, sino también asignarlos aunque sean null.
call_argument_directives_with_null: true

# Hace que el servidor gql use sintaxis de funciones para el contexto de ejecución
# en lugar de generar métodos con receptor sobre él.
# use_function_syntax_for_execution_context: false

# Opcional: build tags que se usarán para cargar los paquetes
# go_build_tags:
#  - private
#  - enterprise

# Opcional: modifica las siglas que se tienen en cuenta en los nombres de Go
# go_initialisms:
#   replace_defaults: false # si es true, las siglas por defecto se sustituyen por las nuevas en lugar de añadirse
#   initialisms: # Lista de siglas para los nombres de Go
#     - 'CC'
#     - 'BCC'

# Opcional: activa los métodos getter/haser para autobind
# autobind_getter_haser: false

# gqlgen busca los nombres de tipo del esquema en estos paquetes de Go:
# si coinciden los usa y, si no, los genera.
autobind:
#  - "github.com/cristianrisueo/graph-bookstore-api/graph/model"

# Esta sección declara la correspondencia entre los tipos de GraphQL y los de Go.
#
# La primera línea de cada tipo se usa por defecto para los argumentos de los resolvers
# y para modelgen; las demás se permiten al enlazar campos. Configúralos
# a tu gusto.
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.IntID
  # gqlgen incluye un envoltorio UUID para GraphQL basado en github.com/google/uuid,
  # pero puedes sustituirlo por tu propia implementación.
  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.UUID

  # La especificación de GraphQL dice explícitamente que Int es un entero con
  # signo de 32 bits. Representarlo con int o int64 de Go puede dar comportamientos
  # inesperados, y algunas herramientas de GraphQL, como Apollo Router, fallan al
  # recibir números que superan los 32 bits.
  #
  # Puedes usar el escalar Int64 que trae gqlgen para enteros de 64 bits, o ignorar
  # la especificación y enlazar Int a graphql.Int / graphql.Int64 (el comportamiento
  # por defecto de gqlgen). Esto vale en casos sencillos en los que no importa la
  # interoperabilidad y solo se esperan números pequeños.
  # Mapeado a graphql.Int (Go int) para que Book.Year int enlace con Int.
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
  Int64:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64

  # Modelos propios (store)
  Book:
    model:
      - github.com/cristianrisueo/graph-bookstore-api/store.Book
  Author:
    model:
      - github.com/cristianrisueo/graph-bookstore-api/store.Author
